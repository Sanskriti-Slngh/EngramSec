[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "engramsec-agent1"
version = "0.1.0"
description = "Evidence-backed browser workflow mapper for isolated web applications"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "playwright>=1.49,<2",
  "pydantic>=2,<3",
  "python-dotenv>=1,<2",
  "requests>=2.31,<3",
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-javascript>=0.25,<0.26",
]

[project.scripts]
engramsec-agent1 = "agent1.cli:main"

[tool.setuptools]
packages = ["agent1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
